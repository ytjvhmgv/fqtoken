name: Refresh FQZB Token

on:
  schedule:
    # 每 12 小时（UTC）刷新一次
    - cron: "0 0 */6 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Login & get token
        env:
          FQZB_ACCOUNT: ${{ secrets.FQZB_ACCOUNT }}
          FQZB_PASSWORD: ${{ secrets.FQZB_PASSWORD }}
        run: python get_token.py

      - name: Commit token.txt to repo root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f token.txt
          if git diff --cached --quiet; then
            echo "token.txt unchanged"
          else
            git commit -m "chore: refresh fqzb token [skip ci]"
            git push
          fi

      - name: Upload token artifact
        uses: actions/upload-artifact@v4
        with:
          name: fqzb-token
          path: token.txt
          retention-days: 7

      - name: Print token prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path("token.txt").read_text(encoding="utf-8").strip()
          print("token_len=", len(t))
          print("token_prefix=", t[:48] + "...")
          PY
